<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Hycon emblem: a gold diamond with an inner gem and a stylised H, in the spirit of
       Hytale's ornamental diamonds. Self-contained, so it also works as the favicon. -->
