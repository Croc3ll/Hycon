    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset=".5" stop-color="#e2b54b"/>
      <stop offset="1" stop-color="#9c7425"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3a5c"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
  </defs>
  <path d="M32 2 L62 32 L32 62 L2 32 Z" fill="url(#g)"/>
  <path d="M32 7 L57 32 L32 57 L7 32 Z" fill="#14161b"/>
  <path d="M32 11 L53 32 L32 53 L11 32 Z" fill="url(#gem)" stroke="url(#g)" stroke-width="1.5"/>
  <path d="M24 21 h5 v8.5 h6 V21 h5 v22 h-5 v-8.5 h-6 V43 h-5 Z" fill="url(#g)"/>
  <path d="M32 2 L35 5 L32 8 L29 5 Z M32 56 L35 59 L32 62 L29 59 Z" fill="#fff2c8"/>
